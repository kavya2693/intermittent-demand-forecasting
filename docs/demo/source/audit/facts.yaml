# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  _P = T.__closure__[0].cell_contents   # the path resolver used by R/J/T (repo-relative, or demo: prefix)

  def PQ(p):
      return pd.read_parquet(_P(p))

  def _block(path, name):
      html = T(path)
      m = _re.search(r"const " + name + r" = (\{.*?\}); /\* " + name + r":END", html, _re.S)
      return json.loads(m.group(1))

  def zero_wins_weekly():
      s = R('outputs/scores_by_segment.csv')
      s = s[s['segment'] != 'all']
      best = s.sort_values('wape').groupby('segment').head(1)
      return sorted(best.loc[best['model'] == 'ZeroForecast', 'segment'].tolist())

  def best_8wk_all_lightgbm():
      s = R('outputs/scores_by_segment.csv')
      s = s[(s['segment'] != 'all') & ~s['model'].isin(['ZeroForecast', 'LightGBM-history-only'])]
      best = s.sort_values('wape_8wk').groupby('segment').head(1)
      return bool(len(best) == 4 and (best['model'] == 'LightGBM').all())

  def boxes_exist():
      checks = [
          ('src/demand_segments/data.py', r'^def generate'), ('src/demand_segments/data.py', r'sales.parquet'),
          ('src/demand_segments/data.py', r'skus.parquet'), ('src/demand_segments/calendar.py', r'^def calendar_frame'),
          ('src/demand_segments/segments.py', r'^def segment_table'), ('src/demand_segments/features.py', r'^ORIGIN_FEATURES'),
          ('src/demand_segments/features.py', r'^TARGET_FEATURES'), ('src/demand_segments/forecast_stats.py', r'^def backtest'),
          ('src/demand_segments/forecast_stats.py', r'^def impute'), ('src/demand_segments/forecast_ml.py', r'^def fit'),
          ('src/demand_segments/backtest.py', r'^def run'), ('src/demand_segments/backtest.py', r'^def champions'),
          ('src/demand_segments/metrics.py', r'^def score'), ('src/demand_segments/report.py', r'^def write'),
          ('scripts/fold_summary.py', r'^def main'), ('Makefile', r'^check:'),
      ]
      return all(grep(f, p) for f, p in checks)

  def scatter_matches():
      run = _block('demo:compositions/s04-routes.html', 'RUN')
      s = R('outputs/sku_segments.csv')
      if len(run['scatter']) != len(s):
          return False
      for (a, c, g), (_, r) in zip(run['scatter'], s.iterrows()):
          if abs(a - r['adi']) > 0.0006 or abs(c - r['cv2']) > 0.0006 or g != r['segment']:
              return False
      return True

  def example_totals():
      run = _block('demo:compositions/s04-routes.html', 'RUN')
      sku = run['example']['sku']
      f = PQ('outputs/forecasts.parquet').query("sku_id == @sku and model == 'LightGBM'")
      parts = []
      for k, g in f.groupby('fold'):
          parts.append(f"{g['yhat'].sum():.1f}/{int(g['y'].sum())}")
          if [round(float(g['yhat'].sum()), 1), int(g['y'].sum())] != run['example']['totals'][k]:
              return 'injected totals differ'
      return ' · '.join(parts) if sku == 'SKU00191' else 'different example SKU'

  def last_window():
      f = PQ('outputs/forecasts.parquet')
      return f[(f['fold'] == f['fold'].max()) & (f['model'] == 'LightGBM')]

  def sheet_rows_match():
      """The SHEET block injected in value.html must equal a fresh recomputation from the repo files."""
      sheet = _block('demo:compositions/value.html', 'SHEET')
      w = last_window()
      seg = R('outputs/sku_segments.csv').set_index('sku_id')
      skus = PQ('data/skus.parquet').set_index('sku_id')
      sales = PQ('data/sales.parquet')
      origin = w['week'].min()
      hist = sales[(sales['week'] < origin) & (sales['week'] >= origin - pd.Timedelta(weeks=52))]
      for r in sheet['rows']:
          g = w[w['sku_id'] == r['sku']].sort_values('week')
          ok = (
              round(float(g['yhat'].sum()), 1) == r['forecast_8wk']
              and int(g['y'].sum()) == r['sold_8wk']
              and [int(v) for v in g['y']] == r['weekly_sold']
              and seg.loc[r['sku'], 'segment'] == r['segment']
              and skus.loc[r['sku'], 'category'] == r['category']
              and int((hist.loc[hist['sku_id'] == r['sku'], 'units'] > 0).sum()) == r['weeks_sold_52']
          )
          if not ok:
              return False
      return (
          [r['sku'] for r in sheet['rows']] == ['SKU01050', 'SKU01018', 'SKU00191', 'SKU00029', 'SKU01486', 'SKU00330']
          and sheet['origin_week'] == str(origin.date())
      )

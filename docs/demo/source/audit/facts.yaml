  - {id: F-33, slides: ["05", "10"], label: "Full run time", shown: "make run ≈ 12 min / ~12 min", type: derived, source: "outputs/run_report.md 'Run time (seconds)'", key: "329 + 256 + 144 = 729 s", formula: "729 / 60 = 12.2 min",
     check: {expr: "round(sum(int(x) for x in _re.findall(r'^- [^:]+: (\\d+)$', T('outputs/run_report.md'), _re.M)) / 60)", fmt: "~{:d} min", expect: "~12 min"}}

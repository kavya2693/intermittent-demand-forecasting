[project]
name = "demand-segments"
version = "0.1.0"
description = "Segment-level weekly demand forecasting for smooth, erratic, intermittent and lumpy SKUs, with a walk-forward backtest"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "lightgbm>=4.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "statsforecast>=2.0",
]

[project.scripts]
demand-segments = "demand_segments.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_segments"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

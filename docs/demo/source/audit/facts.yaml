slides:
  - id: "01"
    title: "The industry"
    image: slides/slide-01.jpg
    time: "0.0-7.2 s"
    composition: "compositions/s01-context.html"
    text:
      - "01 · THE INDUSTRY"
      - "Thousands of SKUs, one weekly forecast to order from."
      - "Who forecasts thousands of products every week, and the four problems they run into."
      - "WHO LIVES WITH THIS · Wholesale & trade distributors · Retail chains · Spare-parts & MRO suppliers"
      - "01 One forecast method runs the whole catalogue — No time to tune each series"
      - "02 Slow movers sell nothing most weeks — The method was built for steady sellers"
      - "03 Rare parts run out, or sit for a year — A trade customer waits, or cash is tied up"
      - "04 Scorecards that reward forecasting zero — Looks accurate, stocks nothing"
      - "THIS PROJECT finds the right forecast for each kind of SKU · segment → backtest → pick → report"
    assumptions: [A-12]
    illustrative: ["The whole slide is context; no repo figures."]
    change: "Edit the chips (#ctx-c1..3) and cards (#ctx-k1..4) in compositions/s01-context.html."
  - id: "02"
    title: "This project"
    image: slides/slide-02.jpg
    time: "6.8-12.0 s"
    composition: "compositions/s02-hook.html"
    text:
      - "02 · THIS PROJECT"
      - "The project in one line: a big catalogue where many products rarely sell."
      - "1,500 SKUs, 156 weeks. 670 are slow movers. Which method fits which?"
      - "slow = sells in < half the weeks · 7 methods, same test weeks · weekly WAPE crowns zero: 829 SKUs"
      - "WAPE = forecast error as a share of actual sales, lower is better. Zero = a forecast that orders nothing."
    assumptions: [A-01, A-02, A-03]
    illustrative: ["Rings in the background are decoration."]
    change: "Headline spans #hook-l1..l3 and chips #hook-f1..f3 in compositions/s02-hook.html."
  - id: "03"
    title: "How it works (white chapter, slide A)"
    image: slides/slide-03.jpg
    time: "11.7-19.7 s"
    composition: "compositions/explainer.html (CONFIG.blocks, CONFIG.groups, CONFIG.loop)"
    text:
      - "03 · HOW IT WORKS"
      - "From sales to the right forecast"
      - "Read left to right: sort each product by how it sells, test every method on past weeks, keep the winner."
      - "SALES weekly units per SKU → SORT steady, spiky or rare? → [REPLAY THE PAST: FORECAST every method competes → FAIR TEST on the same past weeks] → PICK a winner per type → PLAN ✓ method per type ✓ 8-week totals ✓ losses shown"
      - "step forward, repeat (loop over the fair test)"
    assumptions: [A-02, A-03, A-04]
    illustrative: ["Icons and colours are a visual language, not data.", "'Type' is the plain-words name for a demand segment."]
    change: "Edit CONFIG in compositions/explainer.html; badge truth is F-10."
  - id: "04"
    title: "The key idea (white chapter, slide B)"
    image: slides/slide-04.jpg
    time: "19.7-26.7 s"
    composition: "compositions/explainer.html (#ex-b ...)"
    text:
      - "04 · THE KEY IDEA"
      - "Grade the 8-week total"
      - "One slow part, scored two ways. Whichever forecast scores best is the one that gets used."
      - "A part sells 4 units every 4th week — most weeks show zero sales"
      - "Scored week by week, \"zero\" wins — it is never far off a zero week"
      - "Scored on the 8-week total, the steady forecast wins — an order covers weeks, not one week"
      - "ONE SLOW SKU · 8 WEEKS: SOLD 0 0 0 4 0 0 0 4 (total 8) · ZERO 0 ×8 (0) · STEADY 1 ×8 (8)"
      - "WEEK BY WEEK winner: zero · an order of nothing | 8-WEEK TOTAL winner: steady · 8 forecast, 8 sold"
      - "Real backtest, scored week by week: \"zero\" beats every model in the two slow segments, 829 of 1,500 SKUs."
    assumptions: [A-02, A-04]
    illustrative: ["The SOLD / ZERO / STEADY grid is the hand-worked case pinned in tests/test_metrics.py (F-12), not a real SKU."]
    change: "Markup under #ex-b and the grid script in compositions/explainer.html; the footnote figures are F-08 and F-09."
  - id: "05"
    title: "Architecture"
    image: slides/slide-05a.jpg
    image2: slides/slide-05b.jpg
    time: "26.4-42.4 s"
    composition: "compositions/s03-architecture.html"
    text:
      - "05 · ARCHITECTURE"
      - "Seven methods, the same weeks, one scorecard per segment."
      - "Each box is a file in the repo. Data flows left to right; the backtest then picks one winner per segment."
      - "1 · DATA: sales.parquet Weekly sales (1,500 × 156 wk) · skus.parquet SKU master (8 categories) · calendar.py Calendar (known in advance) · data.py · seed 7"
      - "2 · SEGMENTS · FEATURES: segments.py Segmenter (how often · how evenly → 4 segments) · features.py Feature registry (17 origin + 13 target · past data only · 300k–539k rows / fit)"
      - "3 · MODELS: forecast_stats.py 6 per-SKU models (SNaive52 · MA13 · ETS · Croston · TSB · ARIMA · 329 s · 4 procs) · forecast_ml.py Global LightGBM (Tweedie · 400 rounds · direct, h = 1..8 · 256 s · 4 threads) · Ablation (history only · 144 s)"
      - "4 · BACKTEST · DECIDE: backtest.py Walk-forward backtest (same 48 weeks for every model · test windows, 8 weeks apart 6 / 6 · ✕ misaligned windows → stop) → metrics.py Scorecard (WAPE · 8-wk WAPE · bias · MAPE) → champions() Champion per segment (pick on windows 1–3, grade on 4–6 · ✕ zero, ablation: not eligible)"
      - "5 · REPORT · CI: report.py Report (segment tables · ML vs best statistical) → outputs/ (8 CSV + run_report · forecasts.parquet) → fold_summary.py Per-window view (wins · |bias| > 10%) · tests/ · make check CI guards (leakage test · metric pins · same windows · no 0 champion)"
      - "Edge labels: history · units · gap-filled · features · segment · forecasts · refit ×6 · tables · by window · guards"
      - "make run ≈ 12 min · batch, offline · no API key or model server · legend: data / control-check"
      - "champion path: LightGBM won all 4 segments"
    assumptions: [A-01, A-02, A-03, A-04, A-05, A-06, A-07, A-08, A-09]
    illustrative: ["Packets moving along the wires show execution order, not data volumes.", "The origin bar fills 1..6 in animation time, not real time.", "The 'champion path' highlight marks the LightGBM route through the pipeline; the other boxes are dimmed to 75% opacity (text stays at or above 4.5:1 contrast), not removed.", "'Test window' is the plain-words name for a walk-forward origin and its 8 forecast weeks."]
    change: "Node boxes (#n-*) and the W wires array (points, labels, execution order, crit flag) in compositions/s03-architecture.html."
  - id: "06"
    title: "The system running"
    image: slides/slide-06a.jpg
    image2: slides/slide-06b.jpg
    time: "42.0-56.6 s"
    composition: "compositions/s04-routes.html (RUN block injected by tools/inject_sheet.py)"
    text:
      - "06 · THE SYSTEM RUNNING"
      - "Every SKU, placed by how often and how evenly it sells."
      - "Each dot is one SKU. Further right = sells less often; higher up = sale sizes vary more."
      - "Scatter: x = how often it sells: average weeks between sales (log scale), y = how evenly: variation in sale size; dashed cut lines labelled cut-off 1.32 and cut-off 0.49 · 1,500 SKUs · smooth 325 sells most weeks · erratic 346 most weeks, sizes jump · intermittent 397 rare, steady size · lumpy 432 rare, sizes jump"
      - "Dashed lines split the four groups. Measured on sales before the first test window."
      - "One spare part: about 0.4 a week, judged on each 8-week total."
      - "Bars = real weekly sales; purple line = LightGBM forecast. Each shaded column is one 8-week test window."
      - "units sold · LightGBM · seasonal naive; history + test 1..6; LightGBM 3.9 / sold 3 · 3.7 / 3 · 3.6 / 4 · 3.2 / 1 · 4.0 / 1 · 2.9 / 5"
      - "9 models × 1,500 SKUs × 48 weeks = 648,000 forecasts, all on the same 48 test weeks"
    assumptions: [A-02, A-03, A-08]
    illustrative: ["The scatter is redrawn in SVG from outputs/sku_segments.csv (the repo saves no plot); CV² axis runs to 3.4 (max in data 3.20).", "The plain-words segment descriptions are the Syntetos-Boylan quadrant meanings."]
    change: "Re-run tools/export_forecast_sheet.py + tools/inject_sheet.py --block RUN; layout in compositions/s04-routes.html."

<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* 06 THE SYSTEM RUNNING: (A) every SKU on the ADI / CV² plane, from outputs/sku_segments.csv;
           (B) one spare part through the six backtest origins, from outputs/forecasts.parquet.
           Data is inlined by tools/inject_sheet.py between the RUN markers. */
        #routes-root { position: absolute; inset: 0; }
        #routes-root svg.plot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #routes-root .ax { font-family: var(--mono); font-size: 20px; fill: #8494a6; }
        #routes-root .axl { font-family: var(--mono); font-size: 22px; fill: #b2bfcc; }
        #routes-root .panel { position: absolute; left: 1250px; top: 250px; width: 550px; }
        #routes-root .big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 96px; font-weight: 700; letter-spacing: -0.04em; color: var(--ink); line-height: 1; }
        #routes-root .big small { font-size: 36px; color: var(--ink-soft); letter-spacing: 0; margin-left: 12px; }
        #routes-root .seg { display: flex; align-items: center; gap: 18px; margin-top: 30px; }
        #routes-root .seg i { display: block; width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; }
        #routes-root .seg .nm { width: 210px; font-size: 32px; font-weight: 700; color: var(--ink); }
        #routes-root .seg .ct { width: 90px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 32px; font-weight: 700; text-align: right; }
        #routes-root .seg .ds { margin-left: 22px; font-size: 24px; color: var(--ink-soft); white-space: nowrap; }
        #routes-root .defs { margin-top: 40px; padding-top: 22px; border-top: 2px solid var(--line); font-family: var(--mono); font-size: 22px; line-height: 1.6; color: var(--ink-mute); }
        #routes-root .defs b { color: var(--ink-soft); font-weight: 700; }
        #routes-root .title-b { position: absolute; left: 120px; top: 118px; width: 1680px; font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; color: var(--ink); }
        #routes-root .legend-b { position: absolute; left: 120px; top: 214px; display: flex; gap: 34px; font-family: var(--mono); font-size: 22px; color: var(--ink-soft); }
        #routes-root .legend-b span { display: flex; align-items: center; gap: 10px; }
        #routes-root .tot { position: absolute; top: 826px; width: 181px; text-align: center; font-family: var(--mono); font-size: 20px; line-height: 1.35; color: var(--ink-soft); }
        #routes-root .tot b { color: var(--c-model); font-weight: 700; }
        #routes-root .tot em { font-style: normal; color: var(--c-eval); font-weight: 700; }
        #routes-root .count {
          position: absolute; left: 120px; top: 912px; display: flex; align-items: center; gap: 18px; font-family: var(--mono);
          font-size: 26px; color: var(--ink-soft); white-space: nowrap;
        }
        #routes-root .count b { font-size: 34px; color: var(--c-opt); font-variant-numeric: tabular-nums; }
      </style>

      <div id="routes-root" data-composition-id="routes" data-width="1920" data-height="1080">
        <div class="scene" id="routes-in">
          <div class="eyebrow" data-layout-allow-overlap id="routes-eyebrow">06 · The system running</div>
          <!-- phase A -->
          <div id="routes-a">
            <div class="scene-title" data-layout-allow-overlap id="routes-title">Every SKU, placed by how often and how evenly it sells.</div>
            <svg class="plot" id="routes-svg-a" viewBox="0 0 1920 1080"></svg>
            <div class="panel" id="routes-panel">
              <div class="big" id="routes-n"><span id="routes-n-v">0</span><small>SKUs</small></div>
              <div class="seg" id="routes-s0"><i style="background: var(--c-opt)"></i><span class="nm">smooth</span><span class="ct" id="routes-c0" style="color: var(--c-opt)">0</span><span class="ds">sells most weeks</span></div>
              <div class="seg" id="routes-s1"><i style="background: var(--c-data)"></i><span class="nm">erratic</span><span class="ct" id="routes-c1" style="color: var(--c-data)">0</span><span class="ds">most weeks, sizes jump</span></div>
              <div class="seg" id="routes-s2"><i style="background: var(--c-model)"></i><span class="nm">intermittent</span><span class="ct" id="routes-c2" style="color: var(--c-model)">0</span><span class="ds">rare, steady size</span></div>
              <div class="seg" id="routes-s3"><i style="background: var(--c-risk)"></i><span class="nm">lumpy</span><span class="ct" id="routes-c3" style="color: var(--c-risk)">0</span><span class="ds">rare, sizes jump</span></div>
              <div class="defs" id="routes-defs"><b>ADI</b> average weeks between sales<br /><b>CV²</b> variation in sale size<br />history before the first origin</div>
            </div>
          </div>
          <!-- phase B -->
          <div id="routes-b">
            <div class="title-b" id="routes-title-b"></div>
            <div class="legend-b" id="routes-legend-b">
              <span><svg width="22" height="22"><rect x="4" y="2" width="14" height="20" rx="2" fill="#f2c46d" /></svg>units sold</span>
              <span><svg width="44" height="10"><path d="M2 5h40" stroke="#b9a2ff" stroke-width="4" /></svg>LightGBM</span>
              <span><svg width="44" height="10"><path d="M2 5h40" stroke="#8494a6" stroke-width="3" stroke-dasharray="7 6" /></svg>seasonal naive</span>
            </div>
            <svg class="plot" id="routes-svg-b" viewBox="0 0 1920 1080"></svg>
            <div id="routes-tots"></div>
            <div class="count" id="routes-count">9 models × 1,500 SKUs × 48 weeks = <b id="routes-count-v">0</b> forecasts, same windows</div>
          </div>
        </div>
      </div>

          [0, 1, 2, 3].forEach((u) => {
            el("line", { x1: BX0, x2: BX1, y1: by(u), y2: by(u), stroke: "#24364a", "stroke-width": u === 0 ? 2 : 1.5 }, frame);
            txt(frame, BX0 - 14, by(u) + 7, String(u), "ax", "end");
          });
          txt(frame, BX0 + (H * bw) / 2, BY0 - 14, "history", "ax");
          // test windows
          const wins = el("g", { id: "routes-wins" }, B);
          for (let k = 0; k < 6; k++) {
            const x = bxi(H + k * 8);
            el("rect", { x: x + 1, y: BY0 - 40, width: 8 * bw - 2, height: BY1 - BY0 + 40, fill: k % 2 ? "rgba(185,162,255,0.05)" : "rgba(185,162,255,0.09)" }, wins);
            el("line", { x1: x, x2: x, y1: BY0 - 40, y2: BY1, stroke: "#3fd8a8", "stroke-width": 2, opacity: 0.8 }, wins);
            txt(wins, x + 4 * bw, BY0 - 14, "origin " + (k + 1), "ax");
          }
          // bars: history (muted) + actuals
          const bars = el("g", { id: "routes-bars" }, B);
          const barEls = [];
          E.history.concat(E.actual).forEach((u, i) => {
            if (u === null || u === 0) return;
            const r = el("rect", { x: bxi(i) + bw * 0.2, y: by(u), width: bw * 0.6, height: BY1 - by(u), rx: 2, fill: i < H ? "#5b6b7d" : "#f2c46d" }, bars);
            barEls.push({ r, i });
          });
          // forecast lines, one segment per origin (forecasts restart at each origin)
          const lines = el("g", { id: "routes-lines" }, B);
          const seg = (arr, k, stroke, w, dash) => {
            const pts = arr.slice(8 * k, 8 * k + 8).map((v, j) => (bxi(H + 8 * k + j) + bw / 2).toFixed(1) + " " + by(v).toFixed(1));
            const a = { d: "M" + pts.join(" L"), fill: "none", stroke, "stroke-width": w, "stroke-linejoin": "round", "stroke-linecap": "round" };
            if (dash) a["stroke-dasharray"] = dash;
            return el("path", a, lines);
          };
          const lg = [], sn = [];
          for (let k = 0; k < 6; k++) {
            sn.push(seg(E.seasonal_naive, k, "#8494a6", 3, "7 6"));
            lg.push(seg(E.lightgbm, k, "#b9a2ff", 5));
          }
          // per-origin 8-week totals
          const tots = document.getElementById("routes-tots");
          for (let k = 0; k < 6; k++) {
            const [fc, sold] = E.totals[k]; // exported 8-week sums (unrounded inputs, rounded to 0.1)
            tots.insertAdjacentHTML("beforeend",
              '<div class="tot" id="routes-t' + k + '" style="left:' + (bxi(H + 8 * k) + (8 * bw - 181) / 2).toFixed(0) + 'px">LightGBM <b>' + fc.toFixed(1) + "</b><br />sold <em>" + sold + "</em></div>");
          }

          tl.to("#routes-a", { opacity: 0, duration: 0.5, ease: "power2.in" }, P2);
          tl.fromTo("#routes-b", { opacity: 0 }, { opacity: 1, duration: 0.01 }, P2 + 0.4);
          tl.fromTo("#routes-title-b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, P2 + 0.45);
          tl.fromTo("#routes-legend-b", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.8);
          tl.fromTo("#routes-frame", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.6);
          tl.fromTo("#routes-wins", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.9);
          barEls.forEach(({ r, i }) =>
            tl.fromTo(r, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, P2 + 1.0 + (i / N) * 1.6));
          for (let k = 0; k < 6; k++) {
            const at = P2 + 2.6 + k * 0.45;
            tl.fromTo(lg[k], { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.35 }, at);
            tl.fromTo(sn[k], { attr: { opacity: 0 } }, { attr: { opacity: 0.9 }, duration: 0.35 }, at + 0.1);
            tl.fromTo("#routes-t" + k, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at + 0.2);
          }
          tl.fromTo("#routes-count", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, P2 + 4.9);
          const cObj = { v: 0 }, cEl = document.getElementById("routes-count-v");
          tl.to(cObj, { v: RUN.forecast_rows_total || 0, duration: 1.0, ease: "power2.out", onUpdate: () => { cEl.textContent = fmt(cObj.v); } }, P2 + 5.0);
          tl.to("#routes-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["routes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

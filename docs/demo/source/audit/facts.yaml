# Audit facts for the intermittent-demand-forecasting demo video.
# Read by docs/demo/source/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# plus the helpers defined at the end of this file (PQ() reads a parquet file the same way).
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: intermittent-demand-forecasting
  title: "intermittent-demand-forecasting: demo video audit report"
  repo_url: https://github.com/kavya2693/intermittent-demand-forecasting
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 90.4
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [lightgbm, statsforecast, pandas, numpy]
  regenerate:
    - "make run                                   # outputs/*.csv, run_report.md, forecasts.parquet (~12 min)"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_forecast_sheet.py docs/demo/source/assets/forecast_sheet.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/forecast_sheet.json docs/demo/source/compositions/value.html --block SHEET --keys origin_week,window_end_week,skus,model,wape_8wk_all,forecast_units_8wk,sold_units_8wk,rows"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/forecast_sheet.json docs/demo/source/compositions/s04-routes.html --block RUN --keys scatter,example,forecast_rows_total,forecast_models"
    - "python3 docs/demo/source/tools/make_end_scatter.py outputs/sku_segments.csv docs/demo/source/assets/scatter-end.png"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/intermittent-demand-forecasting-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/intermittent-demand-forecasting-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 7, lightgbm_seed: 7, skus: 1500, weeks: 156, origins: 6, horizon_weeks: 8}
  run_time: "outputs/run_report.md: statistical models 329 s + LightGBM 256 s + history-only ablation 144 s = 729 s (about 12 min) for make run (--jobs 4) on the author's laptop"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem: 1,500 SKUs, 156 weekly periods, 8 categories, B2B and B2C channels, seed 7. The production data it stands in for is proprietary; the patterns are the ones written into the generator."
    source: "src/demand_segments/data.py:20-29 (CATEGORIES), :37-39 (GeneratorConfig n_skus=1500, n_weeks=156, seed=7); README 'The data'"
    figures: [F-03, F-04, F-05]
    all_figures: true
    edit: ["src/demand_segments/data.py (GeneratorConfig, CATEGORIES, PATTERN_MIX)"]
    rerun: ["make data", "make run", "export_forecast_sheet.py + inject_sheet.py"]
  - id: A-02
    statement: "Segments use the Syntetos-Boylan cut-offs ADI 1.32 and CV² 0.49, computed on the history before the first origin, and stay fixed for all six origins."
    source: "src/demand_segments/segments.py:14-15; src/demand_segments/backtest.py:51"
    figures: [F-05, F-06, F-08, F-09, F-18, F-37, F-38, F-62]
    edit: ["src/demand_segments/segments.py:14-15"]
    rerun: ["make run", "export_forecast_sheet.py + inject_sheet.py"]
  - id: A-03
    statement: "Walk-forward backtest: six origins, eight weeks apart, each forecasting the next eight weeks (48 test weeks), the same windows for every model."
    source: "src/demand_segments/cli.py:18 (--windows default 6); features.py:21 (HORIZON = 8); backtest.py:29-31 (origins)"
    figures: [F-07, F-11, F-25, F-36, F-39, F-41, F-56]
    edit: ["src/demand_segments/cli.py:18", "src/demand_segments/features.py:21"]
    rerun: ["make run", "export_forecast_sheet.py + inject_sheet.py"]
  - id: A-04
    statement: "Each segment's champion is picked on eight-week WAPE over origins 1-3 and graded on origins 4-6; the zero forecast and the history-only ablation are never eligible."
    source: "src/demand_segments/report.py:30 (n_select = n_windows // 2); backtest.py:100-130 (champions), :108"
    figures: [F-10, F-28, F-29, F-35, F-52, F-53, F-54, F-55, F-72, F-73]
    edit: ["src/demand_segments/backtest.py:100-130", "src/demand_segments/report.py:30"]
    rerun: ["make run"]
  - id: A-05
    statement: "ETS and ARIMA are fitted without a 52-week season (season_length=1); only seasonal naive and LightGBM carry the yearly pattern, so the statistical side is weaker on seasonal SKUs than a tuned seasonal model would be."
    source: "src/demand_segments/forecast_stats.py:22-33; README 'Known limitations'"
    figures: [F-21, F-53, F-55, F-58, F-59, F-60, F-69, F-70]
    edit: ["src/demand_segments/forecast_stats.py:22-33"]
    rerun: ["make run"]
  - id: A-06
    statement: "LightGBM settings: Tweedie objective (variance power 1.3), 400 rounds, 63 leaves, seed 7, 4 threads; one global model, direct 1-8 week horizon, target = sales / SKU level."
    source: "src/demand_segments/forecast_ml.py:11-27"
    figures: [F-23, F-50, F-52, F-54, F-56, F-57, F-59]
    edit: ["src/demand_segments/forecast_ml.py:11-27"]
    rerun: ["make run", "export_forecast_sheet.py + inject_sheet.py"]
  - id: A-07
    statement: "LightGBM may read the calendar, the promotion plan and the price list for the target week (11 'known-future' features), because a planner has them in advance. The per-SKU statistical models see sales history only."
    source: "src/demand_segments/features.py:1-9 (docstring), forecast_ml.py:30-42 (KNOWN_FUTURE)"
    figures: [F-24]
    edit: ["src/demand_segments/forecast_ml.py:30-42", "src/demand_segments/features.py (TARGET_FEATURES)"]
    rerun: ["make run"]
  - id: A-08
    statement: "Feed-gap weeks are filled with a trailing 8-week mean for the statistical models' inputs only; every score uses the raw actuals, and missing actual weeks are skipped, never scored as zero."
    source: "src/demand_segments/forecast_stats.py:37-46 (impute); metrics.py:9-14 (_clean)"
    figures: [F-41, F-45, F-46]
    edit: ["src/demand_segments/forecast_stats.py:37-46"]
    rerun: ["make run"]
  - id: A-09
    statement: "Run times are wall-clock seconds from one make run on the author's laptop with --jobs 4 (statistical models) and 4 LightGBM threads; they change with the machine and its load."
    source: "outputs/run_report.md 'Run time (seconds)'; Makefile:8 (--jobs 4); README 'What I got wrong first'"
    figures: [F-22, F-23, F-24, F-33, F-67]
    edit: ["Makefile:8"]
    rerun: ["make run"]
  - id: A-10
    statement: "Slide 07 shows the LAST backtest origin (2025-11-03, weeks to 2025-12-22) as if it were the planner's sheet, with what actually sold next to it. Rows are the SKU at the median 8-week absolute % error of each segment (plus the next one in the two slow segments), not the best cases. The stock-room drain is forecast total minus weekly actual sales, an illustration, not an inventory simulation (README: point forecasts only)."
    source: "docs/demo/source/tools/export_forecast_sheet.py (row selection); README 'Known limitations'"
    figures: [F-43, F-44, F-45, F-46, F-47]
    edit: ["tools/export_forecast_sheet.py (pick rules)"]
    rerun: ["export_forecast_sheet.py + inject_sheet.py", "hyperframes render"]
  - id: A-11
    statement: "Video rounding: percentages to 1 decimal, units and counts to whole numbers with thousands separators, 8-week totals under 100 units to 1 decimal; '300k-539k', '≈ 12 min' and 'about 0.4 a week' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-20, F-33, F-40, F-45, F-46, F-50, F-51, F-52, F-53, F-54, F-55, F-58, F-59, F-60, F-67, F-69, F-70, F-71]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-12
    statement: "Slide 01 (industries, everyday problems) is general demand-planning knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports problems 1, 2 and 4"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: wholesale & trade distributors, retail chains, spare-parts & MRO suppliers", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (one method for the catalogue; slow movers; rare parts out of stock or overstocked; scorecards that reward zero)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem'", key: "README lines 14-28", formula: "-",
     check: {expr: "grep('README.md', r'runs one forecasting method across the whole catalogue') and grep('README.md', r'out of\\s+stock for a trade customer') and grep('README.md', r'the forecast that minimises it is zero')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "06", "07", "08"], label: "SKUs in the catalogue", shown: "1,500 SKUs", type: direct, source: "outputs/sku_segments.csv", key: "row count", formula: "-",
     check: {expr: "len(R('outputs/sku_segments.csv'))", fmt: "{:,d}", expect: "1,500"}}
  - {id: F-04, slides: ["02", "05"], label: "Weeks of sales history", shown: "156 weeks / 1,500 × 156 wk", type: direct, source: "outputs/run_log.txt (printed by cli.py from data/sales.parquet)", key: "'1500 SKUs, 156 weeks'", formula: "-",
     check: {expr: "grep('outputs/run_log.txt', r'^1500 SKUs, 156 weeks$')", fmt: bool}}
  - {id: F-05, slides: ["02"], label: "Slow movers: SKUs with ADI > 2", shown: "670 are slow movers", type: derived, source: "outputs/sku_segments.csv", key: "adi", formula: "count(adi > 2) = 670",
     check: {expr: "int((R('outputs/sku_segments.csv')['adi'] > 2).sum())", fmt: "{:d}", expect: "670"}}
  - {id: F-06, slides: ["02"], label: "Definition: ADI > 2 means a sale in under half the observed weeks", shown: "slow = sells in < half the weeks", type: direct, source: "src/demand_segments/segments.py:26 (adi = len(h) / len(nz))", key: "ADI = observed weeks / weeks with a sale", formula: "ADI > 2 <=> sale weeks < half of observed weeks",
     check: {expr: "grep('src/demand_segments/segments.py', r'adi = len\\(h\\) / len\\(nz\\)')", fmt: bool}}
  - {id: F-07, slides: ["02", "05"], label: "Methods compared on the same windows (6 statistical + LightGBM)", shown: "7 methods, same test weeks / Seven methods", type: direct, source: "outputs/forecasts.parquet (model column)", key: "models minus ZeroForecast and LightGBM-history-only", formula: "9 - 2 = 7",
     check: {expr: "len(set(PQ('outputs/forecasts.parquet')['model'].unique()) - {'ZeroForecast', 'LightGBM-history-only'})", fmt: "{:d}", expect: "7"}}
  - {id: F-08, slides: ["02", "04", "09"], label: "SKUs in the segments where the zero forecast has the best weekly WAPE (intermittent 397 + lumpy 432)", shown: "weekly WAPE crowns zero: 829 SKUs / 829 of 1,500 SKUs", type: derived, source: "outputs/segment_counts.csv; outputs/scores_by_segment.csv", key: "skus where segment in {intermittent, lumpy}", formula: "397 + 432 = 829",
     check: {expr: "int(R('outputs/segment_counts.csv').query(\"segment in ['intermittent', 'lumpy']\")['skus'].sum())", fmt: "{:d}", expect: "829"}}
  - {id: F-09, slides: ["02", "04", "09"], label: "The zero forecast beats every model on weekly WAPE in exactly the intermittent and lumpy segments", shown: "crowns zero / \"zero\" beats every model in the two slow segments / ordering nothing scores best; would choose \"order nothing\" for both slow segments", type: derived, source: "outputs/scores_by_segment.csv", key: "argmin(wape) per segment", formula: "segments whose best weekly WAPE is ZeroForecast = {intermittent, lumpy}",
     check: {expr: "zero_wins_weekly() == ['intermittent', 'lumpy']", fmt: bool}}
  # ---- slide 03
  - {id: F-10, slides: ["03"], label: "Plan badges: a method per segment, 8-week totals, losses shown", shown: "method per type · 8-week totals · losses shown", type: direct, source: "outputs/champions.csv; outputs/scores_by_segment.csv (wape_8wk); outputs/lightgbm_vs_best_statistical.csv", key: "4 champion rows; wape_8wk column; win share < 50% on intermittent", formula: "-",
     check: {expr: "len(R('outputs/champions.csv')) == 4 and 'wape_8wk' in R('outputs/scores_by_segment.csv').columns and row('outputs/lightgbm_vs_best_statistical.csv', segment='intermittent')['lightgbm_sku_win_share'] < 0.5", fmt: bool}}
  - {id: F-11, slides: ["03", "05"], label: "Replay the past, step forward, repeat (walk-forward origins)", shown: "REPLAY THE PAST · step forward, repeat · refit ×6", type: direct, source: "src/demand_segments/backtest.py:29-31; forecast_stats.py:49-57", key: "origins(); cross_validation(step_size=HORIZON)", formula: "-",
     check: {expr: "grep('src/demand_segments/backtest.py', r'def origins') and grep('src/demand_segments/forecast_stats.py', r'step_size=HORIZON')", fmt: bool}}
  # ---- slide 04
  - {id: F-12, slides: ["04"], label: "Toy example: 4 units every 4th week; zero wins weekly, steady forecast exact on the 8-week total", shown: "SOLD 0 0 0 4 0 0 0 4 · ZERO · STEADY · winners", type: illustrative, source: "tests/test_metrics.py:70-80 (test_eight_week_wape_stops_rewarding_the_zero_forecast)", key: "y = tile([0,0,0,4], 2)", formula: "weekly WAPE: steady 12/8 = 150% > zero 100%; 8-week WAPE: steady 0%, zero 100%",

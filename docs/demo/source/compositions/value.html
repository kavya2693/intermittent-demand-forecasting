<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* WHITE "END-USER VALUE" SLIDE: the artifact the user plans with (left) + a small 2D scene of the
           person using it (right). Data is inlined by tools/inject_sheet.py between the SHEET markers. */
        #value-root {
          position: absolute; inset: 0;
          --w-bg: #ffffff; --w-ink: #111827; --w-soft: #4b5563; --w-mute: #6b7280; --w-line: #d1d5db; --w-faint: #f3f4f6;
          --w-data: #d97706; --w-model: #6d3cf0; --w-tools: #1f8fa8; --w-risk: #dc2b4a; --w-opt: #0f9f6e;
          color: var(--w-ink); font-family: Inter, "Helvetica Neue", sans-serif;
        }
        #value-root .page { position: absolute; inset: 0; background: var(--w-bg); }
        #value-root .edge { position: absolute; top: 0; width: 10px; height: 1080px; background: var(--w-model); }
        #value-root .kick {
          position: absolute; left: 120px; top: 84px; font-family: "JetBrains Mono", monospace; font-size: 24px;
          font-weight: 700; letter-spacing: 0.18em; color: var(--w-mute);
        }
        #value-root .ttl {
          position: absolute; left: 120px; top: 124px; font-family: Montserrat, sans-serif; font-weight: 900;
          font-size: 68px; letter-spacing: -0.02em; white-space: nowrap;
        }
        #value-root .ttl em { font-style: normal; color: var(--w-model); }
        #value-root .uline { position: absolute; left: 124px; top: 222px; width: 120px; height: 10px; border-radius: 5px; background: var(--w-model); transform-origin: left center; }

        /* sheet */
        #value-root .sheet {
          position: absolute; left: 120px; top: 280px; width: 1050px; height: 640px; border: 3px solid var(--w-line);
          border-radius: 24px; background: #fff; box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08); overflow: hidden;
        }
        #value-root .sheet-head {
          height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
          background: var(--w-ink); color: #fff; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
        }
        #value-root .sheet-head span:last-child { color: #c4b5fd; }
        #value-root .row {
          position: relative; display: flex; align-items: center; height: 64px; padding: 0 26px;
          font-family: "JetBrains Mono", monospace; font-size: 21px; color: var(--w-ink); border-bottom: 2px solid var(--w-faint);
        }
        #value-root .row.hdr { height: 54px; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: var(--w-mute); background: #fafafa; }
        #value-root .row .tint { position: absolute; inset: 0; opacity: 0; }
        #value-root .c { position: relative; white-space: nowrap; }
        #value-root .c1 { width: 170px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
        #value-root .c1 i { display: block; width: 14px; height: 14px; border-radius: 4px; background: var(--w-line); }
        #value-root .c2 { width: 180px; font-family: Inter, sans-serif; font-size: 22px; }
        #value-root .c3 { width: 170px; font-family: Inter, sans-serif; font-size: 22px; font-weight: 700; }
        #value-root .c4 { width: 110px; text-align: right; padding-right: 22px; color: var(--w-soft); }
        #value-root .c5 { width: 140px; text-align: right; padding-right: 22px; font-weight: 700; }
        #value-root .c6 { width: 110px; text-align: right; padding-right: 22px; }
        #value-root .c7 { width: 100px; text-align: right; }
        #value-root .more { padding: 14px 30px 0; font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--w-mute); }
        #value-root .totals {
          position: absolute; left: 0; bottom: 0; width: 100%; height: 66px; display: flex; align-items: center; gap: 14px; padding: 0 30px;
          background: #ecfdf5; border-top: 2px solid #a7f3d0; font-size: 23px; font-weight: 700; color: #065f46;
        }
        #value-root .totals b { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--w-opt); position: relative; }
        #value-root .totals svg { position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; }

        /* scene */
        #value-root .scene-lab { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: var(--w-mute); }
        #value-root .room { position: absolute; left: 1220px; top: 312px; width: 600px; height: 608px; border-radius: 24px; border: 3px solid var(--w-line); background: #fbfbfc; }
        #value-root .wk { position: absolute; left: 1560px; top: 276px; width: 260px; text-align: right; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; color: var(--w-ink); }
        #value-root svg.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #value-root .caption {
          position: absolute; left: 120px; top: 944px; width: 1700px; font-size: 30px; font-weight: 700; color: var(--w-ink);
        }
        #value-root .caption span { color: var(--w-model); }
      </style>

      <div id="value-root" data-composition-id="value" data-width="1920" data-height="1080">
        <div class="page" id="va-page">
          <div class="kick" id="va-kick">07 · END-USER VALUE</div>
          <div class="ttl" id="va-ttl">What the <em>planner</em> gets</div>
          <div class="uline" id="va-ul"></div>

          <div class="sheet" id="va-sheet">
            <div class="sheet-head"><span id="va-head-l">8-WEEK FORECAST SHEET</span><span id="va-head-r"></span></div>
            <div class="row hdr" id="va-hdr">
              <div class="c c1">SKU</div><div class="c c2" style="font-family: 'JetBrains Mono', monospace; font-size: 18px">CATEGORY</div>
              <div class="c c3" style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700">SEGMENT</div>
              <div class="c c4">SOLD/52</div><div class="c c5">FORECAST</div><div class="c c6">SOLD</div><div class="c c7">DIFF</div>
            </div>
            <div id="va-rows"></div>
            <div class="more" id="va-more"></div>
            <div class="totals" id="va-totals"></div>
          </div>

          <div class="scene-lab" id="va-lab-room" style="left: 1220px; top: 280px">STOCK ROOM · NEXT 8 WEEKS</div>
          <div class="wk" id="va-wk">WEEK 0 / 8</div>
          <div class="room" id="va-room"></div>
          <svg class="layer" id="va-svg" viewBox="0 0 1920 1080"></svg>

          <div class="caption" id="va-caption">An 8-week total for every SKU, from the model that won its segment. <span>Slow movers get a number, not zero.</span></div>
        </div>
        <div class="edge" id="va-edge"></div>
      </div>

      <script>
        (() => {
          /* SHEET:BEGIN */ const SHEET = {"origin_week":"2025-11-03","window_end_week":"2025-12-22","skus":1500,"model":"LightGBM","wape_8wk_all":0.2074,"forecast_units_8wk":215537.9,"sold_units_8wk":222039,"rows":[{"sku":"SKU01050","category":"toys","channel":"B2C","segment":"smooth","weeks_sold_52":52,"forecast_8wk":1265.6,"sold_8wk":1140,"weekly_forecast":[105.25,114.01,116.8,238.48,130.25,134.24,200.4,226.18],"weekly_sold":[68,135,80,236,60,105,190,266],"animate":0},{"sku":"SKU01018","category":"cleaning","channel":"B2C","segment":"erratic","weeks_sold_52":52,"forecast_8wk":343.6,"sold_8wk":429,"weekly_forecast":[38.81,34.61,43.74,59.91,34.82,39.38,43.58,48.8],"weekly_sold":[37,65,3,88,54,88,61,33],"animate":1},{"sku":"SKU00191","category":"spare_parts","channel":"B2C","segment":"intermittent","weeks_sold_52":15,"forecast_8wk":2.9,"sold_8wk":5,"weekly_forecast":[0.29,0.3,0.32,0.53,0.36,0.33,0.32,0.4],"weekly_sold":[0,0,0,2,0,2,0,1],"animate":2},{"sku":"SKU00029","category":"spare_parts","channel":"B2B","segment":"intermittent","weeks_sold_52":25,"forecast_8wk":5.7,"sold_8wk":4,"weekly_forecast":[0.84,0.77,0.8,0.74,0.85,0.81,0.47,0.43],"weekly_sold":[1,0,0,2,1,0,0,0],"animate":-1},{"sku":"SKU01486","category":"spare_parts","channel":"B2C","segment":"lumpy","weeks_sold_52":31,"forecast_8wk":15.8,"sold_8wk":30,"weekly_forecast":[1.92,1.93,1.97,2.09,1.68,2.03,2.13,2.06],"weekly_sold":[9,0,9,0,1,9,0,2],"animate":3},{"sku":"SKU00330","category":"spare_parts","channel":"B2B","segment":"lumpy","weeks_sold_52":24,"forecast_8wk":7.8,"sold_8wk":15,"weekly_forecast":[0.99,1.13,1.15,1.26,0.9,1.15,0.64,0.6],"weekly_sold":[0,1,0,0,3,11,0,0],"animate":-1}]}; /* SHEET:END */

          const CONFIG = {
            duration: 13.0,
            colors: ["#0f9f6e", "#1f8fa8", "#6d3cf0", "#dc2b4a"], // one per animated row: smooth, erratic, intermittent, lumpy
            bayX: [1362, 1474, 1586, 1698], bayW: 84, bayTop: 486, bayBot: 790,
            person: { x: 1284, y: 560 },
          };
          const NS = "http://www.w3.org/2000/svg";
          const svg = document.getElementById("va-svg");
          const el = (tag, attrs, parent) => {
            const n = document.createElementNS(NS, tag);
            Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
            (parent || svg).appendChild(n);
            return n;
          };
          const tx = (parent, x, y, s, attrs) => {
            const t = el("text", Object.assign({ x, y, "text-anchor": "middle", "font-family": "JetBrains Mono, monospace", "font-size": 20, fill: "#4b5563" }, attrs || {}), parent);
            t.textContent = s;
            return t;
          };
          const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
          const fmt = (v) => Math.round(v).toLocaleString("en-US");
          const fmt1 = (v) => (v >= 100 ? fmt(v) : v.toFixed(1));
          const sign = (v) => (v >= 0 ? "+" : "−") + fmt1(Math.abs(v));
          const tl = gsap.timeline({ paused: true });
          const D = CONFIG.duration;
          const rows = SHEET.rows || [];

          // ---------------- sheet ----------------
          document.getElementById("va-head-r").textContent = "FROM " + SHEET.origin_week + " · LightGBM";
          const rowsEl = document.getElementById("va-rows");
          rows.forEach((r, i) => {
            const col = r.animate >= 0 ? CONFIG.colors[r.animate] : "#d1d5db";
            const diff = r.forecast_8wk - r.sold_8wk;
            rowsEl.insertAdjacentHTML("beforeend",
              '<div class="row" id="va-r' + i + '"><div class="tint" id="va-t' + i + '" style="background:' + col + '22"></div>' +
              '<div class="c c1"><i style="background:' + col + '"></i>' + r.sku + "</div>" +
              '<div class="c c2">' + r.category.replace("_", " ") + "</div>" +
              '<div class="c c3" style="color:' + (r.animate >= 0 ? col : "#4b5563") + '">' + r.segment + "</div>" +
              '<div class="c c4">' + r.weeks_sold_52 + '</div><div class="c c5">' + fmt1(r.forecast_8wk) + '</div><div class="c c6">' + fmt(r.sold_8wk) + "</div>" +
              '<div class="c c7" style="color:' + (diff >= 0 ? "#0f9f6e" : "#b45309") + '">' + sign(diff) + "</div></div>");
          });
          document.getElementById("va-more").textContent = "+ " + fmt(SHEET.skus - rows.length) + " more SKUs on this sheet";
          document.getElementById("va-totals").innerHTML =
            "<b>" + CHECK + "</b>" + fmt(SHEET.skus) + " SKUs · " + fmt(SHEET.forecast_units_8wk) + " forecast vs " + fmt(SHEET.sold_units_8wk) +
            " sold · 8-week WAPE " + (100 * SHEET.wape_8wk_all).toFixed(1) + "%";

          // ---------------- scene: planner, four bays, eight weeks ----------------
          const P = CONFIG.person;
          const person = el("g", { id: "va-person" });
          el("circle", { cx: P.x, cy: P.y - 34, r: 16, fill: "#111827" }, person);
          el("path", { d: "M" + (P.x - 26) + " " + (P.y + 40) + "v-26a26 22 0 0 1 52 0v26z", fill: "#6d3cf0" }, person);
          const paper = el("g", { id: "va-paper" }, person);
          el("rect", { x: P.x + 18, y: P.y - 10, width: 26, height: 32, rx: 4, fill: "#fff", stroke: "#111827", "stroke-width": 2.5 }, paper);
          [0, 1, 2].forEach((k) => el("line", { x1: P.x + 23, x2: P.x + 39, y1: P.y - 2 + k * 8, y2: P.y - 2 + k * 8, stroke: "#9ca3af", "stroke-width": 2 }, paper));
          tx(person, P.x, P.y + 72, "planner", { "font-size": 20, fill: "#6b7280" });
          tx(svg, 1520, 400, "stock to the plan, then 8 real weeks of sales", { fill: "#6b7280" }).setAttribute("id", "va-hint");

          const H = CONFIG.bayBot - CONFIG.bayTop;
          const anim = rows.map((r, i) => ({ r, i })).filter((o) => o.r.animate >= 0);
          const LOAD0 = 2.4, WEEK0 = 5.0, WEEK = 0.5;
          const bays = [];
          anim.forEach(({ r, i }, b) => {
            const col = CONFIG.colors[r.animate];
            const x = CONFIG.bayX[b], w = CONFIG.bayW;
            const scale = Math.max(r.forecast_8wk, r.sold_8wk) * 1.08;
            const hOf = (u) => (Math.max(0, u) / scale) * H;
            const g = el("g", { id: "va-bay" + b });
            el("rect", { x, y: CONFIG.bayTop, width: w, height: H, rx: 10, fill: "#f3f4f6", stroke: "#d1d5db", "stroke-width": 2.5 }, g);
            [0.25, 0.5, 0.75].forEach((f) => el("line", { x1: x + 6, x2: x + w - 6, y1: CONFIG.bayTop + f * H, y2: CONFIG.bayTop + f * H, stroke: "#e5e7eb", "stroke-width": 2 }, g));
            el("circle", { cx: x + w / 2 - 40, cy: CONFIG.bayBot + 23, r: 6, fill: col }, g);
            tx(g, x + w / 2 + 6, CONFIG.bayBot + 30, r.sku.replace("SKU", "#"), { "font-size": 20, fill: "#111827", "font-weight": 700 });
            // stock fill: a full-height rect scaled from the bottom
            const fill = el("rect", { x: x + 5, y: CONFIG.bayTop, width: w - 10, height: H, rx: 7, fill: col, "fill-opacity": 0.85 });
            const planLab = el("g", { opacity: 0 });
            tx(planLab, x + w / 2, CONFIG.bayTop - 40, "plan", { fill: "#6b7280" });
            tx(planLab, x + w / 2, CONFIG.bayTop - 14, fmt1(r.forecast_8wk), { fill: "#111827", "font-weight": 700, "font-size": 22 });
            const diff = r.forecast_8wk - r.sold_8wk;
            const endLab = el("g", { opacity: 0 });
            const ec = diff >= 0 ? "#0f9f6e" : "#b45309";
            tx(endLab, x + w / 2, CONFIG.bayBot + 66, sign(diff), { fill: ec, "font-weight": 700, "font-size": 22 });
            tx(endLab, x + w / 2, CONFIG.bayBot + 92, diff >= 0 ? "left" : "short", { fill: ec });
            bays.push({ r, i, b, col, x, w, fill, planLab, endLab, hOf });
            // load: three boxes fly from the planner to the bay, then the bay fills to the plan
            const lt = LOAD0 + b * 0.45;
            tl.to("#va-t" + i, { opacity: 1, duration: 0.25 }, lt);
            [0, 1, 2].forEach((k) => {
              const bx = el("rect", { x: -8, y: -8, width: 16, height: 16, rx: 3, fill: col, opacity: 0 });
              tl.fromTo(bx, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.05 }, lt + k * 0.1);
              tl.fromTo(bx, { x: P.x + 31, y: P.y + 6 }, { x: x + w / 2 - 14 + k * 14, y: CONFIG.bayTop - 40, duration: 0.5, ease: "power2.inOut" }, lt + k * 0.1);
              tl.to(bx, { attr: { opacity: 0 }, duration: 0.1 }, lt + k * 0.1 + 0.5);
            });
            const h0 = hOf(r.forecast_8wk);
            tl.fromTo(fill, { attr: { y: CONFIG.bayBot, height: 0 } }, { attr: { y: CONFIG.bayBot - h0, height: h0 }, duration: 0.6, ease: "power2.out" }, lt + 0.55);
            tl.fromTo(planLab, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3 }, lt + 0.7);
            tl.to("#va-t" + i, { opacity: 0.45, duration: 0.4 }, lt + 1.0);
            // eight weeks of real sales drain the bay, week by week
            let cum = 0;
            r.weekly_sold.forEach((u, k) => {
              cum += u;
              const h = hOf(r.forecast_8wk - cum);
              tl.to(fill, { attr: { y: CONFIG.bayBot - h, height: h }, duration: WEEK * 0.7, ease: "power1.inOut" }, WEEK0 + k * WEEK);
            });
            tl.fromTo(endLab, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3 }, WEEK0 + 8 * WEEK + 0.1 + b * 0.1);
          });
          const wk = { v: 0 }, wkEl = document.getElementById("va-wk");
          tl.to(wk, { v: 8, duration: 8 * WEEK, ease: "none", onUpdate: () => { wkEl.textContent = "WEEK " + Math.min(8, Math.ceil(wk.v - 0.0001)) + " / 8"; } }, WEEK0);

          // ---------------- choreography ----------------
          tl.fromTo("#va-page", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.7, ease: "power3.inOut" }, 0);
          tl.fromTo("#va-edge", { x: 0, opacity: 1 }, { x: 1920, duration: 0.7, ease: "power3.inOut" }, 0);
          tl.to("#va-edge", { opacity: 0, duration: 0.1 }, 0.7);
          tl.fromTo("#va-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.fromTo("#va-ttl", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#va-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo("#va-sheet", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          rows.forEach((_, i) => tl.fromTo("#va-r" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.3 + i * 0.3));
          tl.fromTo("#va-more", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3 + rows.length * 0.3);
          tl.fromTo("#va-totals", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);
          tl.fromTo(["#va-room", "#va-lab-room", "#va-wk", "#va-hint"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
          bays.forEach((o) => tl.fromTo("#va-bay" + o.b, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.2 + o.b * 0.12));
          tl.fromTo("#va-person", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.fromTo("#va-paper", { rotation: 0 }, { rotation: -10, svgOrigin: CONFIG.person.x + 31 + " " + (CONFIG.person.y + 6), duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.3);
          tl.fromTo("#va-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.6);
          // wipe out (white -> dark), revealing the next dark scene underneath
          tl.to("#va-page", { clipPath: "inset(0px 0px 0px 100%)", duration: 0.7, ease: "power3.inOut" }, D - 0.7);
          tl.fromTo("#va-edge", { x: 0, opacity: 0 }, { x: 1920, opacity: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, D - 0.7);
          window.__timelines["value"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
